lligence']}],\n   questions:[\n     {id:'q8',q:'Ask Visit Milwaukee for the CVB introductions now or after the renewal signs?',why:'Tom offered them unprompted during the renewal conversation.',options:['After signing','Now','Let Ava ask']},\n     {id:'q9',q:'Do you want a written case study from Germanfest?',why:'It would go into the festival proposal template.',options:['Yes','Only the numbers','No']}],\n   decisions:[\n     {id:'d8',q:'Who owns account profiles',options:[\n       {label:'Ava drafts, you approve',note:'Same gate as proposals',rec:true},\n       {label:'You own them',note:'They go stale again'}]}],\n   actions:[\n     {id:'ac15',label:'Add EAA AirVenture and SynerComm profiles to Account Profiles',target:'MKOS · Account Profiles'},\n     {id:'ac16',label:'Record the referral pattern in Customer Intelligence',target:'MKOS · Customer Intelligence'},\n     {id:'ac17',label:'Create a Germanfest case study task assigned to Ava',target:'Queue'},\n     {id:'ac18',label:'Add the adoption benchmark to the proposal cover letter template',target:'Library · Proposal cover letter'}]}\n];\n\nconst CAL_DAYS = [\n  {key:'mon',label:'Mon',date:'Sep 7'},\n  {key:'tue',label:'Tue',date:'Sep 8'},\n  {key:'wed',label:'Wed',date:'Sep 9'},\n  {key:'thu',label:'Thu',date:'Sep 10',today:true},\n  {key:'fri',label:'Fri',date:'Sep 11'}\n];\n\nconst CAL_FIXED = [\n  {day:'mon',from:4,span:1,title:'Kyle 1:1',who:'Kyle'},\n  {day:'mon',from:8,span:2,title:'Datamatic standup',who:'Datamatic'},\n  {day:'tue',from:6,span:2,title:'Priya Raman · Baird QA window',who:'Client'},\n  {day:'tue',from:16,span:2,title:'Singular weekly demo',who:'Singular'},\n  {day:'wed',from:12,span:2,title:'Baird Center · pricing call',who:'Client'},\n  {day:'wed',from:14,span:1,title:'Kyle 1:1',who:'Kyle'},\n  {day:'wed',from:16,span:2,title:'Datamatic · schema review',who:'Datamatic'},\n  {day:'thu',from:5,span:2,title:'Ellen Voss · EAA follow-up',who:'Client'},\n  {day:'thu',from:12,span:1,title:'Ava 1:1',who:'Ava'},\n  {day:'fri',from:8,span:2,title:'Tom Brennan · renewal redlines',who:'Client'},\n  {day:'fri',from:18,span:2,title:'Weekly close',who:'Max'}\n];\n\nconst WORK_ITEMS = [\n  {id:'w1',name:'EAA AirVenture proposal',domain:'GTM',who:'Max'},\n  {id:'w2',name:'v2.0 data model spec',domain:'Product',who:'Datamatic'},\n  {id:'w3',name:'SynerComm launch',domain:'Delivery',who:'Kyle'},\n  {id:'w4',name:'Baird Center pricing',domain:'GTM',who:'Client'},\n  {id:'w5',name:'Placemark taxonomy decision',domain:'Product',who:'Kyle'},\n  {id:'w6',name:'Power hour list',domain:'Ops',who:'Max'},\n  {id:'w7',name:'Sponsor rate card v3',domain:'GTM',who:'Ava'},\n  {id:'w8',name:'QA severity thresholds',domain:'Product',who:'Singular'},\n  {id:'w9',name:'August reconciliation',domain:'Finance',who:'Ledgerbook'}\n];\n\nconst CAL_CATS = [\n  {label:'Deep work',color:'#E3532D',bg:'rgba(227,83,45,.20)'},\n  {label:'Power hour',color:'#F39A46',bg:'rgba(243,154,70,.18)'},\n  {label:'Admin',color:'#6E685F',bg:'rgba(255,255,255,.07)'},\n  {label:'Buffer',color:'#948E84',bg:'rgba(255,255,255,.04)'}\n];\n\nconst SLOT_H = 26;\n\nclass Component extends DCLogic {\n  state = {\n    nav:'dashboard', tabs:{}, dashOpen:{},\n    collapsed:false, openFire:null, focused:null,\n    fires:['f1','f2','f3'], fireModal:false, demotedNote:null,\n    powerDone:{2:true},\n    qDomain:'All', qOwner:'All', qSource:'All', qLane:'All', taskId:null, stepsDone:{}, openStep:null,\n    decideOpen:null, resolved:{}, selected:{},\n    drawerId:null,\n    priceId:null, placemarks:260, pages:40, attendance:25000, etype:'Convention', portfolio:false,\n    productTab:'Tickets', qaTicketed:{},\n    composer:null, featureDraft:'', updateDraft:'', newFeatures:[], newUpdates:[],\n    sessionPicker:false, sessionDomain:null, promoteState:null,\n    approvalSel:'a1', rejectOpen:false, approvalState:{},\n    accountId:null, acctDraft:'', acctNotes:{},\n    mkosId:null, mkosDraft:'', sugState:{}, mkosComments:{},\n    qaReportId:null, qaItems:{},\n    libId:null, libKind:'All', libAudience:'All', libQuery:'', libPrompt:'', libAction:null, libCopied:false,\n    auditId:null, auditPhase:'Analysis', answers:{}, decisions:{}, appliedActions:{},\n    calCat:'Deep work', calDomain:'All', calWho:'All', calWork:'w1', calDrag:null,\n    calBlocks:[\n      {id:'b1',day:'mon',from:2,span:4,cat:'Deep work',workId:'w2'},\n      {id:'b2',day:'wed',from:2,span:4,cat:'Deep work',workId:'w2'},\n      {id:'b3',day:'wed',from:18,span:2,cat:'Power hour',workId:'w6'},\n      {id:'b4',day:'thu',from:2,span:3,cat:'Deep work',workId:'w2'},\n      {id:'b5',day:'fri',from:13,span:2,cat:'Admin',workId:'w9'}\n    ]\n  };\n\n  set = (k,v) => this.setState({[k]:v});\n\n  money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }\n\n  navGo(id, tab){\n    const tabs = tab ? {...this.state.tabs, [id]:tab} : this.state.tabs;\n    this.setState({nav:id, tabs, accountId:null, mkosId:null, qaReportId:null, libId:null, libAction:null, libCopied:false, taskId:null, openStep:null, auditId:null});\n    window.scrollTo(0,0);\n  }\n  setTab(group, tab){\n    this.setState({tabs:{...this.state.tabs, [group]:tab}, accountId:null, mkosId:null, qaReportId:null, libId:null, auditId:null});\n    window.scrollTo(0,0);\n  }\n\n  componentDidMount(){\n    this._onUp = () => { if (this.state.calDrag) this.calUp(); };\n    window.addEventListener('mouseup', this._onUp);\n  }\n  componentWillUnmount(){ window.removeEventListener('mouseup', this._onUp); }\n\n  slotOf(e){\n    const r = e.currentTarget.getBoundingClientRect();\n    return Math.max(0, Math.min(23, Math.floor((e.clientY - r.top) / SLOT_H)));\n  }\n\n  calDown(day, e){ this.setState({calDrag:{day, a:this.slotOf(e), b:this.slotOf(e)}}); }\n  calMove(day, e){\n    const d = this.state.calDrag;\n    if (!d || d.day !== day) return;\n    this.setState({calDrag:{...d, b:this.slotOf(e)}});\n  }\n  calUp(){\n    const s = this.state, d = s.calDrag;\n    if (!d) return;\n    const from = Math.min(d.a, d.b), to = Math.max(d.a, d.b);\n    const block = {id:'b' + Date.now(), day:d.day, from, span:(to - from + 1), cat:s.calCat, workId:s.calWork};\n    this.setState({calBlocks:s.calBlocks.concat([block]), calDrag:null});\n  }\n  calRemove(id){ this.setState({calBlocks:this.state.calBlocks.filter(b => b.id !== id)}); }\n\n  slotLabel(i){\n    const h = 7 + Math.floor(i / 2), m = i % 2 ? '30' : '00';\n    const ampm = h >= 12 ? 'pm' : 'am';\n    const hh = h > 12 ? h - 12 : h;\n    return hh + ':' + m + ampm;\n  }\n\n  copyBody(lines){\n    const txt = lines.join('\\n\\n');\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(() => {});\n    this.setState({libCopied:true});\n    setTimeout(() => this.setState({libCopied:false}), 1800);\n  }\n\n  // ---- pricing ----\n  priceTiers(){\n    const s = this.state;\n    const defs = [\n      {name:'Essential', base:4500, p:100, c:25, a:10000},\n      {name:'Professional', base:9500, p:250, c:60, a:40000},\n      {name:'Enterprise', base:18500, p:600, c:150, a:100000}\n    ];\n    const mult = {'Festival':1,'Convention':1.1,'Motorsport':1.25,'Destination':1.15}[s.etype] || 1;\n    const rows = defs.map(d => {\n      const op = Math.max(0, s.placemarks - d.p) * 18;\n      const oc = Math.max(0, s.pages - d.c) * 45;\n      const oa = Math.max(0, s.attendance - d.a) * 0.05;\n      const sub = (d.base + op + oc + oa) * mult;\n      const total = s.portfolio ? sub * 0.85 : sub;\n      return {def:d, op, oc, oa, mult, total};\n    });\n    const min = Math.min.apply(null, rows.map(r => r.total));\n    return rows.map(r => ({...r, recommended: r.total === min}));\n  }\n\n  renderVals(){\n    const s = this.state;\n    const pendingSug = MKOS.reduce((n,f) => n + f.suggestions.filter(x => !s.sugState[x.id]).length, 0);\n    const GROUP_TABS = {\n      work:['Queue','Delivery'],\n      revenue:['Pipeline','Subscriptions','Ads','Accounts'],\n      product:[
