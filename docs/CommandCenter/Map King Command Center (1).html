document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

98\" alt=\"Map King\" style=\"width:26px;height:26px;flex:0 0 auto\">\n      <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font:700 14px/1.15 Geist,sans-serif;letter-spacing:-0.02em;color:#F6F3EF\">Map King<br><span style=\"color:#948E84;font-weight:500\">Command Center<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <nav style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px;flex:1\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ n.go }}\" title=\"{{ n.label }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:10px;text-align:left;background:{{ n.bg }};color:{{ n.fg }};font:500 14px/1.2 Geist,sans-serif;position:relative\" style-hover=\"background:rgba(255,255,255,.06)\">\n          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ n.icon }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px;flex:0 0 auto\"><path d=\"{{ n.d1 }}\"><\u002Fpath><path d=\"{{ n.d2 }}\"><\u002Fpath><\u002Fsvg>\n          <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"flex:1;white-space:nowrap\">{{ n.label }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ n.showBadge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"background:#E3532D;color:#fff;font:600 11px/1 Geist,sans-serif;padding:4px 7px;border-radius:999px\">{{ n.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"padding:12px 10px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px\">\n      <div style=\"width:30px;height:30px;flex:0 0 auto;border-radius:999px;background:#E3532D;color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px/1 Geist,sans-serif\">MK<\u002Fdiv>\n      <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font:600 13px/1.2 Geist,sans-serif;white-space:nowrap\">Max H<\u002Fdiv>\n          <div style=\"font:500 11px/1.2 Geist,sans-serif;color:#948E84\">Founder / CEO<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:relative;color:#BDB7AD;font:400 15px/1 Geist,sans-serif\">◔<span style=\"position:absolute;top:-3px;right:-4px;width:7px;height:7px;border-radius:999px;background:#E3532D\"><\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleSidebar }}\" style=\"margin:0;padding:10px;border:0;border-top:1px solid rgba(255,255,255,.07);background:transparent;color:#6E685F;font:500 12px/1 Geist,sans-serif;text-align:center\" style-hover=\"color:#F6F3EF\">{{ collapseLabel }}<\u002Fbutton>\n  <\u002Faside>\n\n  <!-- MAIN -->\n  <main style=\"flex:1;min-width:0;padding:34px 40px 80px;max-width:1560px\">\n\n    <sc-if value=\"{{ hasTabs }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.07)\">\n        <sc-for list=\"{{ groupTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.pick }}\" style=\"padding:10px 16px;border-radius:10px;border:1px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};font:600 13px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ DASHBOARD ============ -->\n    <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:28px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Dashboard<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 40px/1.05 Geist,sans-serif;letter-spacing:-0.03em\">Thursday, September 10<\u002Fh1>\n          <div style=\"margin-top:12px;font:400 16px/1.5 Geist,sans-serif;color:#BDB7AD\">{{ dashLine }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:24px;margin-bottom:26px\">\n          <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#EA744B;margin-bottom:18px\">The brief<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:18px;max-width:820px\">\n            <sc-for list=\"{{ briefLines }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div>\n                <div style=\"font:400 16px/1.6 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ b.text }}<\u002Fdiv>\n                <div style=\"margin-top:9px;display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ b.ev }}\" as=\"e\" hint-placeholder-count=\"2\">\n                    <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#948E84\">{{ e }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n            <div>\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Since you last opened it<\u002Fdiv>\n              <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ briefChanges }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;gap:9px;font:400 14px/1.55 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\"><span style=\"color:#6E685F\">·<\u002Fspan>{{ c }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#EA744B\">Do this first<\u002Fdiv>\n              <div style=\"margin-top:12px;font:500 15px/1.55 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ briefAction }}<\u002Fdiv>\n              <div style=\"margin-top:16px;display:flex;gap:8px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ goDeepWork }}\" style=\"padding:11px 15px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Start the deep work block<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goSpec }}\" style=\"padding:11px 15px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">See the ticket<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px\">\n          <sc-for list=\"{{ bigTiles }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.10);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n              <button sc-camel-on-click=\"{{ t.jump }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:transparent;text-align:left\" style-hover=\"opacity:.85\">\n                <span style=\"flex:1;font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">{{ t.title }}<\u002Fspan>\n                <span style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B;white-space:nowrap\">{{ t.goLabel }} →<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"font:700 24px/1.25 Geist,sans-serif;letter-spacing:-0.02em;color:#F6F3EF;text-wrap:pretty\">{{ t.value }}<\u002Fdiv>\n              <div style=\"border-left:2px solid {{ t.accent }};padding-left:13px;font:500 15px/1.5 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ t.line }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.4 Geist,sans-serif;color:#948E84\">{{ t.meta }}<\u002Fdiv>\n              <sc-if value=\"{{ t.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ t.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div style=\"font:400 14px/1.55 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ r }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"margin-top:auto;align-self:flex-start;padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:transparent;color:#948E84;font:600 12px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">{{ t.chev }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px\">\n          <sc-for list=\"{{ smallTiles }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:11px\">\n              <button sc-camel-on-click=\"{{ t.jump }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;padding:0;border:0;background:transparent;text-align:left\" style-hover=\"opacity:.85\">\n                <span style=\"flex:1;font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">{{ t.title }}<\u002Fspan>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;color:#EA744B;white-space:nowrap\">{{ t.goLabel }} →<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"font:700 19px/1.25 Geist,sans-serif;letter-spacing:-0.02em;color:{{ t.accent }};text-wrap:pretty\">{{ t.value }}<\u002Fdiv>\n              <div style=\"font:400 13px/1.55 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ t.line }}<\u002Fdiv>\n              <sc-if value=\"{{ t.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"font:500 12px/1.4 Geist,sans-serif;color:#948E84\">{{ t.meta }}<\u002Fdiv>\n                  <sc-for list=\"{{ t.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div style=\"font:400 13px/1.5 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ r }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"margin-top:auto;align-self:flex-start;padding:7px 11px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:transparent;color:#948E84;font:600 11px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">{{ t.chev }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ TODAY ============ -->\n    <sc-if value=\"{{ isToday }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:36px\">\n          <div>\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Today<\u002Fdiv>\n            <h1 style=\"margin:0;font:700 40px/1.05 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF\">Thursday, September 10<\u002Fh1>\n            <div style=\"margin-top:12px;font:400 16px/1.5 Geist,sans-serif;color:#BDB7AD\">{{ stateLine }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:10px;align-items:center\">\n            <div style=\"text-align:right;padding-right:14px;border-right:1px solid rgba(255,255,255,.09)\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Now<\u002Fdiv>\n              <div style=\"font:600 15px/1.3 Geist,sans-serif;color:#F6F3EF;margin-top:3px\">{{ currentBlockLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ tryAddFire }}\" style=\"padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Add a fire<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- A. ON FIRE -->\n        <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:14px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#E3532D\">On fire<\u002Fdiv>\n          <div style=\"font:500 13px/1.3 Geist,sans-serif;color:#6E685F\">Hard cap of three. A fourth costs you one.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:44px\">\n          <sc-for list=\"{{ fires }}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div style=\"background:#221C19;border:1px solid {{ f.border }};border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:mkIn 220ms ease-out\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px\">\n                <div style=\"width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:rgba(227,83,45,.14);color:#EA744B;display:flex;align-items:center;justify-content:center;font:700 15px/1 Geist,sans-serif\">{{ f.rank }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 19px/1.28 Geist,sans-serif;letter-spacing:-0.01em;color:#F6F3EF;text-wrap:pretty\">{{ f.name }}<\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                    <span style=\"font:600 11px/1 Geist,sans-serif;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#BDB7AD\">{{ f.domain }}<\u002Fspan>\n                    <span style=\"font:600 11px/1 Geist,sans-serif;padding:5px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#948E84\">{{ f.source }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"border-left:2px solid #E3532D;padding:2px 0 2px 14px\">\n                <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#E3532D;margin-bottom:6px\">Next action<\u002Fdiv>\n                <div style=\"font:500 16px/1.45 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ f.next }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:6px\">{{ f.est }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;font:500 12px/1.2 Geist,sans-serif;color:#948E84\">\n                <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:18px;border-radius:999px;background:rgba(255,255,255,.09);color:#BDB7AD;display:flex;align-items:center;justify-content:center;font:600 9px/1 Geist,sans-serif\">{{ f.initials }}<\u002Fspan>{{ f.owner }}<\u002Fspan>\n                <span>{{ f.due }}<\u002Fspan>\n                <span style=\"color:{{ f.ageColor }}\">{{ f.age }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-top:1px solid rgba(255,255,255,.08);padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Why it's stuck<\u002Fdiv>\n                  <div style=\"font:400 14px/1.5 Geist,sans-serif;color:#BDB7AD\">{{ f.why }}<\u002Fdiv>\n                  <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-top:6px\">After this<\u002Fdiv>\n                  <sc-for list=\"{{ f.after }}\" as=\"s\" hint-placeholder-count=\"2\">\n                    <div style=\"font:400 14px/1.5 Geist,sans-serif;color:#BDB7AD;display:flex;gap:8px\"><span style=\"color:#6E685F\">·<\u002Fspan>{{ s }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;gap:8px;align-items:center;margin-top:auto\">\n                <button sc-camel-on-click=\"{{ f.start }}\" style=\"flex:1;padding:11px 14px;border:0;border-radius:12px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\" style-active=\"transform:scale(.97)\">{{ f.startLabel }}<\u002Fbutton>\n                <button style=\"padding:11px 14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif;white-space:nowrap\" style-hover=\"background:rgba(255,255,255,.06)\">Open in {{ f.source }}<\u002Fbutt u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Everything, in one place<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">Aggregated from Attio, Linear and Airtable. Triage here, work there.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap\">\n          <!-- filter rail -->\n          <div style=\"flex:1 1 170px;max-width:230px;min-width:150px;background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px\">\n            <sc-for list=\"{{ filterGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:18px\">\n                <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F;margin-bottom:9px\">{{ g.label }}<\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ g.options }}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:6px 10px;border-radius:999px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 12px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <button sc-camel-on-click=\"{{ clearFilters }}\" style=\"width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">Clear filters<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- list -->\n          <div style=\"flex:4 1 280px;min-width:0\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px\">\n              <sc-for list=\"{{ lanes }}\" as=\"l\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ l.pick }}\" style=\"padding:8px 13px;border-radius:10px;border:1px solid {{ l.border }};background:{{ l.bg }};color:{{ l.fg }};font:600 13px/1.2 Geist,sans-serif;display:flex;align-items:center;gap:8px\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ l.label }}<span style=\"color:#6E685F;font-weight:500\">{{ l.count }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:12px;background:rgba(227,83,45,.10);border:1px solid rgba(227,83,45,.28);border-radius:12px\">\n                <div style=\"flex:1;font:600 13px/1.2 Geist,sans-serif;color:#F6F3EF\">{{ selectedCount }} selected<\u002Fdiv>\n                <button style=\"padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#F6F3EF;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Retag<\u002Fbutton>\n                <button style=\"padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#F6F3EF;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Reassign<\u002Fbutton>\n                <button style=\"padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#F6F3EF;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Push to next week<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ clearSel }}\" style=\"padding:8px 10px;border-radius:10px;border:0;background:transparent;color:#948E84;font:600 12px/1 Geist,sans-serif\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"background:#1A1614;border:1px solid px/1 Geist,sans-serif\">Done<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ t.drop }}\" style=\"padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#BDB7AD;font:600 12px/1 Geist,sans-serif\">Drop<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ t.resched }}\" style=\"padding:6px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#BDB7AD;font:600 12px/1 Geist,sans-serif\">Reschedule<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ queueEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:56px 24px;text-align:center\">\n                  <div style=\"font:600 16px/1.3 Geist,sans-serif;color:#F6F3EF\">Nothing in this lane<\u002Fdiv>\n                  <div style=\"margin-top:8px;font:400 14px/1.5 Geist,sans-serif;color:#6E685F\">Clear a filter, or enjoy the quiet.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ DELIVERY ============ -->\n    <sc-if value=\"{{ isDelivery }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Delivery<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Every build in flight<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:22px 24px;margin-bottom:28px\">\n          <div style=\"display:flex;flex-wrap:wrap x/1.4 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ q.what }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ q.where }} · detected {{ q.when }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ q.make }}\" style=\"padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:{{ q.btnFg }};font:600 12px/1 Geist,sans-serif;white-space:nowrap\" style-hover=\"background:rgba(255,255,255,.06)\">{{ q.btn }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ COMPANY ============ -->\n    <sc-if value=\"{{ isCompany }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:28px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Company<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Telemetry<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">Through September 10, 2026.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:24px;margin-bottom:26px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:20px\">\n            <div>\n              <div style=\"font:600 16px/1.3 Geist,sans-serif;color:#F6F3EF\">Revenue vs. delivery capacity<\u002Fdiv>\n              <div style=\"font:500 13px/1.4 Geist,sans-serif;color:#6E685F;margin-top:6px\">The two lines that decide whether the company works.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:18px;font:500 12px/1.2 Geist,sans-serif\">\n              <span style=\"color:#EA744B\">■ Revenue booked<\u002Fspan>\n              <span style=\"color:#7C6CF0\">■ Capacity consumed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 900 260\" sc-camel-preserve-aspect-ratio=\"none\" style=\"width:100%;height:260px;display:block\" data-om-raster=\"true\">\n            <line x1=\"0\" y1=\"20\" x2=\"900\" y2=\"20\" stroke=\"rgba(255,255,255,.06)\"><\u002Fline>\n            <line x1=\"0\" y1=\"80\" x2=\"900\" y2=\"80\" stroke=\"rgba(255,255,255,.06)\"><\u002Fline>\n            <line x1=\"0\" y1=\"140\" x2=\"900\" y2=\"140\" stroke=\"rgba(255,255,255,.06)\"><\u002Fline>\n            <line x1=\"0\" y1=\"200\" x2=\"900\" y2=\"200\" stroke=\"rgba(255,255,255,.06)\"><\u002Fline>\n            <line x1=\"0\" y1=\"238\" x2=\"900\" y2=\"238\" stroke=\"rgba(255,255,255,.12)\"><\u002Fline>\n            <path d=\"M20 214 L100 206 L180 184 L260 190 L340 152 L420 128 L500 138 L580 96 L660 74 L740 62 L820 44 L880 36\" fill=\"none\" stroke=\"#E3532D\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n            <path d=\"M20 224 L100 218 L180 202 L260 196 L340 176 L420 168 L500 150 L580 132 L660 118 L740 100 L820 88 L880 78\" fill=\"none\" stroke=\"#7C6CF0\" stroke-width=\"2.5\" stroke-dasharray=\"5 6\" stroke-linecap=\"round\"><\u002Fpath>\n            <circle cx=\"880\" cy=\"36\" r=\"4\" fill=\"#E3532D\"><\u002Fcircle>\n            <circle cx=\"880\" cy=\"78\" r=\"4\" fill=\"#7C6CF0\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"display:flex;justify-content:space-between;margin-top:10px;font:500 11px/1.2 Geist,sans-serif;color:#524D46\">\n            <span>Oct<\u002Fspan><span>Nov<\u002Fspan><span>Dec<\u002Fspan><span>Jan<\u002Fspan><span>Feb<\u002Fspan><span>Mar<\u002Fspan><span>Apr<\u002Fspan><span>May<\u002Fspan><span>Jun<\u002Fspan><span>Jul<\u002Fspan><span>Aug<\u002Fspan><span>Sep<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:30px\">\n          <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"9\">\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F\">{{ m.label }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px\">\n                <div>\n                  <div style=\"font:700 32px/1 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF\">{{ m.value }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:{{ m.deltaColor }};margin-top:8px\">{{ m.delta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <svg sc-camel-view-box=\"0 0 90 34\" style=\"width:90px;height:34px;flex:0 0 auto\" data-om-raster=\"true\">\n                  <path d=\"{{ m.spark }}\" fill=\"none\" stroke=\"{{ m.sparkColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath>\n                <\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font:500 12px/1.4 Geist,sans-serif;color:#524D46;margin-top:12px\">{{ m.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Shipped this week<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px\">\n          <sc-for list=\"{{ team }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px\">\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <div style=\"width:28px;height:28px;border-radius:999px;background:{{ p.color }};color:#fff;display:flex;align-items:center;justify-content:center;font:700 11px/1 Geist,sans-serif;flex:0 0 auto\">{{ p.initials }}<\u002Fdiv>\n                <div>\n                  <div style=\"font:600 14px/1.2 Geist,sans-serif;color:#F6F3EF\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font:500 11px/1.2 Geist,sans-serif;color:#6E685F;margin-top:3px\">{{ p.role }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ p.shipped }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:9px;font:400 13px/1.45 Geist,sans-serif;color:#BDB7AD\"><span style=\"color:#2DE0A7\">✓<\u002Fspan>{{ s }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ AUDITS ============ -->\n    <sc-if value=\"{{ isAudits }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Audits<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">What the data says you are getting wrong<\u002Fh1>\n          <div style=\"margin-top:10px;max-width:720px;font:400 15px/1.55 Geist,sans-serif;color:#948E84\">Each audit reads the whole platform, asks you what it cannot know, holds the decisions with you, then applies the changes where they belong. Nothing applies without your pick.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ auditList }}\" as=\"a\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ a.open }}\" style=\"text-align:left;width:100%;background:#1E1A18;border:1px solid {{ a.border }};border-radius:16px;padding:20px\" style-hover=\"border-color:rgba(255,255,255,.24)\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between\">\n                <div style=\"flex:1 1 300px;min-width:0\">\n                  <div style=\"font:600 18px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:6px\">{{ a.scope }} · run {{ a.run }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ a.stageBg }};color:{{ a.stageFg }};flex:0 0 auto\">{{ a.stage }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;max-width:660px;font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ a.summary }}<\u002Fdiv>\n              <div style=\"margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center\">\n                <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">{{ a.counts }}<\u002Fspan>\n                <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#948E84\">{{ a.progress }}<\u002Fspan>\n                <span style=\"flex:1;text-align:right;font:600 12px/1.2 Geist,sans-serif;color:#EA744B\">Open audit →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ AUDIT DETAIL ============ -->\n    <sc-if value=\"{{ isAuditDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <button sc-camel-on-click=\"{{ backToAudits }}\" style=\"margin-bottom:20px;padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1.2 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">All audits<\u002Fbutton>\n\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Audit<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 32px/1.1 Geist,sans-serif;letter-spacing:-0.03em\">{{ audit.name }}<\u002Fh1>\n          <div style=\"margin-top:11px;font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">{{ audit.scope }} · run {{ audit.run }}<\u002Fdiv>\n          <div style=\"margin-top:14px;max-width:680px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ audit.summary }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px\">\n          <sc-for list=\"{{ auditPhases }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ p.pick }}\" style=\"display:flex;align-items:center;gap:9px;padding:10px 15px;border-radius:10px;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.fg }};font:600 13px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">\n              {{ p.label }}<span style=\"font:500 11px/1.2 Geist,sans-serif;color:#6E685F\">{{ p.badge }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showAnalysis }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ audit.findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n              <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px\">\n                <div style=\"display:flex;align-items:flex-start;gap:12px\">\n                  <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ f.sevBg }};color:{{ f.sevFg }};flex:0 0 auto\">{{ f.sev }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0;font:600 16px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ f.title }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"margin-top:11px;font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ f.detail }}<\u002Fdiv>\n                <div style=\"margin-top:13px;display:flex;flex-wrap:wrap;gap:7px\">\n                  <sc-for list=\"{{ f.evidence }}\" as=\"ev\" hint-placeholder-count=\"2\">\n                    <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#948E84\">{{ ev }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showQuestions }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font:500 13px/1.4 Geist,sans-serif;color:#948E84;margin-bottom:16px\">{{ audit.qLine }}. These are the things the platform cannot tell the agent.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ audit.questions }}\" as=\"q\" hint-placeholder-count=\"3\">\n                <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px\">\n                  <div style=\"font:600 16px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ q.q }}<\u002Fdiv>\n                  <div style=\"margin-top:8px;font:400 13px/1.55 Geist,sans-serif;color:#6E685F;text-wrap:pretty\">{{ q.why }}<\u002Fdiv>\n                  <div style=\"margin-top:14px;display:flex;flex-wrap:wrap;gap:7px\">\n                    <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:9px 14px;border-radius:10px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:600 12px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ o.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ q.answered }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);font:600 12px/1.3 Geist,sans-serif;color:#2DE0A7\">Answered · {{ q.answer }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDecisions }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"font:500 13px/1.4 Geist,sans-serif;color:#948E84;margin-bottom:16px\">{{ audit.dLine }}. The recommended option is marked, and it is still your pick.<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ audit.decisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <div>\n                  <div style=\"font:600 16px/1.35 Geist,sans-serif;color:#F6F3EF;margin-bottom:11px;text-wrap:pretty\">{{ d.q }}<\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px\">\n                    <sc-for list=\"{{ d.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ o.pick }}\" style=\"text-align:left;background:{{ o.bg }};border:1px solid {{ o.border }};border-radius:13px;padding:16px\" style-hover=\"border-color:rgba(255,255,255,.28)\">\n                        <div style=\"display:flex;align-items:flex-start;gap:9px;justify-content:space-between\">\n                          <div style=\"font:600 14px/1.35 Geist,sans-serif;color:{{ o.fg }};text-wrap:pretty\">{{ o.label }}<\u002Fdiv>\n                          <sc-if value=\"{{ o.recommended }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"font:600 10px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:rgba(227,83,45,.18);color:#EA744B;flex:0 0 auto\">Rec<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"margin-top:9px;font:400 12px/1.55 Geist,sans-serif;color:#6E685F;text-wrap:pretty\">{{ o.note }}<\u002Fdiv>\n                      <\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ d.decided }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:10px;font:600 12px/1.3 Geist,sans-serif;color:#2DE0A7\">Decided · {{ d.chosen }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showChanges }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <sc-if value=\"{{ audit.gateOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:12px;padding:15px 18px;margin-bottom:16px;background:rgba(243,154,70,.10);border:1px solid rgba(243,154,70,.28);border-radius:12px\">\n                <div style=\"font:600 13px/1.4 Geist,sans-serif;color:#F39A46\">{{ audit.dLine }} — changes below reflect the decisions you have made so far.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px\">\n              <div style=\"flex:1;font:500 13px/1.4 Geist,sans-serif;color:#948E84\">{{ audit.aLine }}. Each change lands in the system that owns it.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ audit.applyAll }}\" style=\"padding:11px 16px;border-radius:12px;border:1px solid rgba(227,83,45,.45);background:rgba(227,83,45,.10);color:#EA744B;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(227,83,45,.18)\">Apply all<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ audit.actions }}\" as=\"x\" hint-placeholder-count=\"4\">\n                <div style=\"background:#1E1A18;border:1px solid {{ x.border }};border-radius:14px;padding:17px;display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n                  <div style=\"flex:1 1 260px;min-width:0\">\n                    <div style=\"font:500 14px/1.45 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ x.label }}<\u002Fdiv>\n                    <div style=\"margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                      <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#948E84\">{{ x.target }}<\u002Fspan>\n                      <span style=\"font:600 11px/1.3 Geist,sans-serif;color:{{ x.statusFg }}\">{{ x.statusLabel }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ x.notDone }}\" hint-placeholder-val=\"{{ true }}\">\n                    <button sc-camel-on-click=\"{{ x.apply }}\" style=\"flex:0 0 auto;padding:10px 15px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Apply<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:14px;font:500 12px/1.5 Geist,sans-serif;color:#524D46\">Applying writes to MKOS, Linear, Attio or Airtable. This app keeps the record of what the audit changed.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ CALENDAR ============ -->\n    <sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Calendar · week of Sep 7<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Block the work around the calls<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">Pick a category and what you are working on, then drag on the grid to place a block. Calls are fixed.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px\">\n          <sc-for list=\"{{ calStats }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px 18px\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F\">{{ m.label }}<\u002Fdiv>\n              <div style=\"font:700 26px/1.05 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF;margin-top:9px\">{{ m.value }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.35 Geist,sans-serif;color:#524D46;margin-top:7px\">{{ m.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"flex:1 1 180px;max-width:280px;min-width:160px;background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px\">\n            <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F;margin-bottom:9px\">Category<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px\">\n              <sc-for list=\"{{ calCats }}\" as=\"c\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ c.pick }}\" style=\"display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:500 12px/1.2 Geist,sans-serif\">\n                  <span style=\"width:6px;height:6px;border-radius:999px;background:{{ c.dot }}\"><\u002Fspan>{{ c.label }}\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F;margin-bottom:9px\">Tag<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px\">\n              <sc-for list=\"{{ calDomains }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:6px 10px;border-radius:999px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 12px/1.2 Geist,sans-serif\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F;margin-bottom:9px\">Stakeholder<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px\">\n              <sc-for list=\"{{ calWhos }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:6px 10px;border-radius:999px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 12px/1.2 Geist,sans-serif\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F;margin-bottom:9px\">Work on<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ calWorkList }}\" as=\"w\" hint-placeholder-count=\"5\">\n                <button sc-camel-on-click=\"{{ w.pick }}\" style=\"text-align:left;padding:10px 12px;border-radius:10px;border:1px solid {{ w.border }};background:{{ w.bg }};color:{{ w.fg }};font:500 13px/1.35 Geist,sans-serif\">\n                  {{ w.name }}\n                  <span style=\"display:block;font:500 11px/1.2 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ w.meta }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ calWorkEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:18px 12px;text-align:center;font:500 12px/1.5 Geist,sans-serif;color:#524D46\">Nothing matches that tag and stakeholder.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"flex:3 1 300px;min-width:0\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px;background:rgba(227,83,45,.08);border:1px solid rgba(227,83,45,.26);border-radius:12px\">\n              <span style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#EA744B;flex:0 0 auto\">Placing<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:600 13px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ calSelLabel }}<\u002Fdiv>\n                <div style=\"font:500 11px/1.2 Geist,sans-serif;color:#948E84;margin-top:4px\">{{ calSelMeta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;text-align:right\">Drag on a day to place it<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;overflow-x:auto\">\n              <div style=\"display:flex;gap:8px;min-width:620px\">\n                <div style=\"width:46px;flex:0 0 auto;padding-top:38px\">\n                  <sc-for list=\"{{ hourRows }}\" as=\"h\" hint-placeholder-count=\"12\">\n                    <div style=\"height:52px;font:500 11px/1.2 Geist,sans-serif;color:#524D46;text-align:right;padding-right:6px\">{{ h.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-for list=\"{{ calGrid }}\" as=\"d\" hint-placeholder-count=\"5\">\n                  <div style=\"flex:1;min-width:104px\">\n                    <div style=\"height:32px;margin-bottom:6px;border-radius:8px;background:{{ d.headBg }};display:flex;align-items:center;justify-content:center;gap:6px\">\n                      <span style=\"font:600 12px/1.2 Geist,sans-serif;color:{{ d.headFg }}\">{{ d.label }}<\u002Fspan>\n                      <span style=\"font:500 11px/1.2 Geist,sans-serif;color:#6E685F\">{{ d.date }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div sc-camel-on-mouse-down=\"{{ d.down }}\" sc-camel-on-mouse-move=\"{{ d.move }}\" style=\"position:relative;height:{{ calGridH }};border-radius:10px;background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 25px, rgba(255,255,255,.07) 25px 26px);cursor:crosshair;overflow:hidden\">\n                      <sc-for list=\"{{ d.fixed }}\" as=\"f\" hint-placeholder-count=\"2\">\n                        <div style=\"position:absolute;left:2px;right:2px;top:{{ f.top }};height:{{ f.height }};pointer-events:none;background:rgba(124,108,240,.16);border-left:2px solid #7C6CF0;border-radius:6px;padding:5px 7px;overflow:hidden\">\n                          <div style=\"font:600 11px/1.25 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ f.title }}<\u002Fdiv>\n                          <div style=\"font:500 10px/1.2 Geist,sans-serif;color:#A79BFF;margin-top:3px\">{{ f.time }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <sc-for list=\"{{ d.blocks }}\" as=\"b\" hint-placeholder-count=\"1\">\n                        <div style=\"position:absolute;left:2px;right:2px;top:{{ b.top }};height:{{ b.height }};pointer-events:none;background:{{ b.bg }};border:1px solid {{ b.border }};border-radius:6px;padding:5px 7px;overflow:hidden\">\n                          <div style=\"display:flex;gap:4px;align-items:flex-start\">\n                            <div style=\"flex:1;min-width:0\">\n                              <div style=\"font:600 11px/1.25 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ b.title }}<\u002Fdiv>\n                              <div style=\"font:500 10px/1.2 Geist,sans-serif;color:{{ b.color }};margin-top:3px\">{{ b.sub }}<\u002Fdiv>\n                            <\u002Fdiv>\n                            <button sc-camel-on-click=\"{{ b.remove }}\" style=\"pointer-events:auto;flex:0 0 auto;padding:0 3px;border:0;background:transparent;color:#948E84;font:600 12px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">×<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <sc-if value=\"{{ d.drag }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"position:absolute;left:2px;right:2px;top:{{ d.drag.top }};height:{{ d.drag.height }};pointer-events:none;background:{{ d.drag.bg }};border:1px dashed {{ d.drag.color }};border-radius:6px;padding:5px 7px\">\n                          <div style=\"font:600 10px/1.2 Geist,sans-serif;color:#F6F3EF\">{{ d.drag.label }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:16px;font:500 12px/1.3 Geist,sans-serif;color:#524D46\">\n              <span style=\"color:#A79BFF\">■ Calls and meetings, fixed<\u002Fspan>\n              <span style=\"color:#EA744B\">■ Blocks you placed<\u002Fspan>\n              <span style=\"color:#FF6B5E\">■ Red border means it overlaps a call<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ LIBRARY ============ -->\n    <sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:24px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Library<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Templates and prompts<\u002Fh1>\n          <div style=\"margin-top:10px;max-width:700px;font:400 15px/1.55 Geist,sans-serif;color:#948E84\">Client-facing templates and the prompts that run against your MKOS files. Open one to copy it, or hand it to the agent to reshape.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px\">\n          <input value=\"{{ libQuery }}\" sc-camel-on-change=\"{{ setLibQuery }}\" placeholder=\"Search templates and prompts\" style=\"flex:1 1 260px;min-width:0;padding:12px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#1A1614;color:#F6F3EF;font:400 14px/1.3 Geist,sans-serif\">\n          <sc-for list=\"{{ libFilters }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <sc-for list=\"{{ g.options }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"padding:9px 13px;border-radius:999px;border:1px solid {{ o.border }};background:{{ o.bg }};color:{{ o.fg }};font:500 12px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F\">{{ libCount }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px\">\n          <sc-for list=\"{{ libItems }}\" as=\"x\" hint-placeholder-count=\"9\">\n            <button sc-camel-on-click=\"{{ x.open }}\" style=\"text-align:left;width:100%;background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:rgba(255,255,255,.24)\">\n              <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ x.kindBg }};color:{{ x.kindFg }}\">{{ x.kind }}<\u002Fspan>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;color:{{ x.audFg }}\">{{ x.audience }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:600 17px/1.3 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ x.name }}<\u002Fdiv>\n              <div style=\"font:400 13px/1.55 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ x.use }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                <sc-for list=\"{{ x.tags }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <span style=\"font:500 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:#948E84\">{{ t }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">{{ x.meta }}<\u002Fspan>\n                <span style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B\">Open →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ libEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:56px 24px;text-align:center;background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px\">\n            <div style=\"font:600 16px/1.3 Geist,sans-serif;color:#F6F3EF\">Nothing matches that<\u002Fdiv>\n            <div style=\"margin-top:8px;font:400 14px/1.5 Geist,sans-serif;color:#6E685F\">Try a shorter search, or clear the type filter.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ LIBRARY ITEM ============ -->\n    <sc-if value=\"{{ isLibItem }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <button sc-camel-on-click=\"{{ backToLibrary }}\" style=\"margin-bottom:20px;padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1.2 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">All library items<\u002Fbutton>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:26px\">\n          <div style=\"flex:1 1 380px;min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Library<\u002Fdiv>\n            <h1 style=\"margin:0;font:700 32px/1.1 Geist,sans-serif;letter-spacing:-0.03em\">{{ libItem.name }}<\u002Fh1>\n            <div style=\"margin-top:12px;max-width:620px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ libItem.use }}<\u002Fdiv>\n            <div style=\"margin-top:10px;font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">{{ libItem.metaLine }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ libItem.copy }}\" style=\"flex:0 0 auto;padding:11px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:{{ libItem.copyFg }};font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">{{ libItem.copyLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;align-items:start\">\n          <div style=\"min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Body<\u002Fdiv>\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px\">\n              <sc-for list=\"{{ libItem.body }}\" as=\"ln\" hint-placeholder-count=\"4\">\n                <div style=\"font:400 14px/1.7 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ ln }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:12px;font:500 12px/1.5 Geist,sans-serif;color:#524D46\">Braces are fill-ins. The agent fills them from the account when you ask it to.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Reshape with the agent<\u002Fdiv>\n            <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px\">\n              <div style=\"display:flex;flex
