-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ libItem.actions }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ a.pick }}\" style=\"padding:9px 13px;border-radius:10px;border:1px solid {{ a.border }};background:{{ a.bg }};color:{{ a.fg }};font:600 12px/1.2 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.28)\">{{ a.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <textarea value=\"{{ libPrompt }}\" sc-camel-on-change=\"{{ setLibPrompt }}\" placeholder=\"Or write your own — “rewrite for a convention client who has no content owner.”\" style=\"width:100%;min-height:76px;resize:vertical;margin-top:14px;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.10);background:#141110;color:#F6F3EF;font:400 14px/1.55 Geist,sans-serif\"><\u002Ftextarea>\n              <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px\">\n                <button sc-camel-on-click=\"{{ runLibPrompt }}\" style=\"padding:11px 16px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Run<\u002Fbutton>\n                <span style=\"flex:1;font:500 12px/1.4 Geist,sans-serif;color:#524D46\">Nothing overwrites the saved template. Copy what you want.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ libItem.hasResult }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;background:#1A1614;border:1px solid rgba(227,83,45,.28);border-radius:16px;overflow:hidden\">\n                <div style=\"padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px\">\n                  <div style=\"flex:1;font:600 13px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ libItem.resultLabel }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ libItem.copyResult }}\" style=\"padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:transparent;color:{{ libItem.copyFg }};font:600 12px/1 Geist,sans-serif\">{{ libItem.copyLabel }}<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ libItem.clearResult }}\" style=\"padding:8px 10px;border-radius:9px;border:0;background:transparent;color:#948E84;font:600 12px/1 Geist,sans-serif\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"padding:20px;display:flex;flex-direction:column;gap:13px\">\n                  <sc-for list=\"{{ libItem.result }}\" as=\"ln\" hint-placeholder-count=\"2\">\n                    <div style=\"font:400 14px/1.7 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ ln }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font:500 12px/1.4 Geist,sans-serif;color:#524D46\">Draft. Read it before it goes anywhere near a client.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ QA REPORTS ============ -->\n    <sc-if value=\"{{ isQa }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">QA reports · Linear<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">What the QA agent found<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">{{ qaHeadline }}. Accept a finding and it becomes a Linear ticket, filed under its report.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ qaReports }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ r.open }}\" style=\"text-align:left;width:100%;background:#1E1A18;border:1px solid {{ r.border }};border-radius:16px;padding:20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center\" style-hover=\"border-color:rgba(255,255,255,.24)\">\n              <div style=\"flex:1 1 260px;min-width:0\">\n                <div style=\"font:600 17px/1.3 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ r.build }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.35 Geist,sans-serif;color:#6E685F;margin-top:7px\">{{ r.stage }} · run {{ r.run }} · {{ r.agent }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.35 Geist,sans-serif;color:#524D46;margin-top:5px\">{{ r.scope }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;flex:0 0 auto\">\n                <sc-for list=\"{{ r.counts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ c.bg }};color:{{ c.fg }}\">{{ c.label }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"flex:0 0 auto;text-align:right;min-width:150px\">\n                <div style=\"font:600 13px/1.2 Geist,sans-serif;color:{{ r.triageFg }}\">{{ r.triageLine }}<\u002Fdiv>\n                <div style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B;margin-top:7px\">Open report →<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ QA REPORT DETAIL ============ -->\n    <sc-if value=\"{{ isQaReport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <button sc-camel-on-click=\"{{ backToQa }}\" style=\"margin-bottom:20px;padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1.2 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">All QA reports<\u002Fbutton>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:26px\">\n          <div style=\"min-width:0;flex:1 1 420px\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">QA report<\u002Fdiv>\n            <h1 style=\"margin:0;font:700 32px/1.1 Geist,sans-serif;letter-spacing:-0.03em\">{{ qaReport.build }}<\u002Fh1>\n            <div style=\"margin-top:11px;font:500 13px/1.4 Geist,sans-serif;color:#948E84\">{{ qaReport.stage }} · run {{ qaReport.run }} · {{ qaReport.agent }} · {{ qaReport.scope }}<\u002Fdiv>\n            <div style=\"margin-top:14px;max-width:640px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ qaReport.summary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex:0 0 auto\">\n            <button sc-camel-on-click=\"{{ qaReport.acceptAll }}\" style=\"padding:11px 15px;border-radius:12px;border:1px solid rgba(227,83,45,.45);background:rgba(227,83,45,.10);color:#EA744B;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(227,83,45,.18)\">Accept all remaining<\u002Fbutton>\n            <button style=\"padding:11px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Open in Linear<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;align-items:start\">\n          <div style=\"min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Findings<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ qaReport.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                <div style=\"background:#1E1A18;border:1px solid {{ i.border }};border-radius:14px;padding:18px\">\n                  <div style=\"display:flex;align-items:flex-start;gap:12px\">\n                    <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ i.sevBg }};color:{{ i.sevFg }};flex:0 0 auto\">{{ i.sev }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font:600 15px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ i.what }}<\u002Fdiv>\n                      <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:6px\">{{ i.where }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin-top:12px;font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ i.detail }}<\u002Fdiv>\n                  <sc-if value=\"{{ i.untriaged }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n                      <button sc-camel-on-click=\"{{ i.accept }}\" style=\"padding:10px 14px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Accept · create Linear ticket<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ i.dismiss }}\" style=\"padding:10px 14px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#BDB7AD;font:600 12px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">Not an issue<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ i.resolved }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.07);font:600 12px/1.3 Geist,sans-serif;color:{{ i.resolvedFg }}\">{{ i.resolvedLabel }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Tickets from this report<\u002Fdiv>\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n              <sc-for list=\"{{ qaReport.tickets }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:flex-start;gap:13px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                  <span style=\"font:500 12px/1.5 Geist,sans-serif;color:#EA744B;width:66px;flex:0 0 auto\">{{ t.id }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font:500 14px/1.4 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ t.what }}<\u002Fdiv>\n                    <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ t.sev }} · filed under this report<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ qaReport.noTickets }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"padding:34px 20px;text-align:center\">\n                  <div style=\"font:600 15px/1.3 Geist,sans-serif;color:#F6F3EF\">No tickets yet<\u002Fdiv>\n                  <div style=\"margin-top:8px;font:400 13px/1.5 Geist,sans-serif;color:#6E685F\">Accept a finding and it appears here with its Linear id.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ qaReport.hasTickets }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;font:500 12px/1.5 Geist,sans-serif;color:#524D46\">Tickets live in Linear. This view only keeps them grouped by the report that found them.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ MKOS FILES ============ -->\n    <sc-if value=\"{{ isMkos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">MKOS · Map King Operating System<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">The files everything else reads<\u002Fh1>\n          <div style=\"margin-top:10px;max-width:700px;font:400 15px/1.55 Geist,sans-serif;color:#948E84\">Sessions, agents and proposals all run off these six files. Open one to read it, leave a prompt, or approve a suggested update drawn from what your command center is showing.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:28px\">\n          <sc-for list=\"{{ mkosStats }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F\">{{ m.label }}<\u002Fdiv>\n              <div style=\"font:700 28px/1.05 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF;margin-top:10px\">{{ m.value }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.35 Geist,sans-serif;color:#524D46;margin-top:8px\">{{ m.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px\">\n          <sc-for list=\"{{ mkosFiles }}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ f.open }}\" style=\"text-align:left;width:100%;background:#1E1A18;border:1px solid {{ f.border }};border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:13px\" style-hover=\"border-color:rgba(255,255,255,.24)\">\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <span style=\"width:6px;height:6px;border-radius:999px;background:{{ f.dot }};flex:0 0 auto\"><\u002Fspan>\n                <div style=\"flex:1;min-width:0;font:600 17px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ f.name }}<\u002Fdiv>\n                <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F\">{{ f.version }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:400 13px/1.55 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ f.purpose }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px 16px;font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">\n                <span style=\"color:{{ f.stateFg }}\">{{ f.state }}<\u002Fspan>\n                <span>{{ f.meta }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ f.pending }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:2px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;gap:12px\">\n                  <span style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B\">{{ f.pendLabel }}<\u002Fspan>\n                  <span style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B\">Review →<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ MKOS FILE DETAIL ============ -->\n    <sc-if value=\"{{ isMkosFile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <button sc-camel-on-click=\"{{ backToMkos }}\" style=\"margin-bottom:20px;padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1.2 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">All MKOS files<\u002Fbutton>\n\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">MKOS file<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 32px/1.1 Geist,sans-serif;letter-spacing:-0.03em\">{{ mkosFile.name }}<\u002Fh1>\n          <div style=\"margin-top:11px;max-width:640px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ mkosFile.stateLine }}<\u002Fdiv>\n          <div style=\"margin-top:10px;font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">{{ mkosFile.metaLine }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;align-items:start\">\n          <div style=\"min-width:0;display:flex;flex-direction:column;gap:28px\">\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Contents<\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:22px\">\n                <sc-for list=\"{{ mkosFile.sections }}\" as=\"sec\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#EA744B\">{{ sec.heading }}<\u002Fdiv>\n                    <div style=\"margin-top:11px;display:flex;flex-direction:column;gap:9px\">\n                      <sc-for list=\"{{ sec.lines }}\" as=\"ln\" hint-placeholder-count=\"2\">\n                        <div style=\"font:400 14px/1.65 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ ln }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Notes &amp; prompts<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px\">\n                <sc-for list=\"{{ mkosFile.comments }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"background:{{ c.bg }};border:1px solid {{ c.border }};border-radius:14px;padding:15px 17px\">\n                    <div style=\"display:flex;align-items:baseline;gap:10px\">\n                      <span style=\"font:600 13px/1.2 Geist,sans-serif;color:#F6F3EF\">{{ c.who }}<\u002Fspan>\n                      <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F\">{{ c.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:9px;font:400 14px/1.6 Geist,sans-serif;color:{{ c.fg }};text-wrap:pretty\">{{ c.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px\">\n                <textarea value=\"{{ mkosDraft }}\" sc-camel-on-change=\"{{ setDraft }}\" placeholder=\"Leave a note, or write a prompt for the next session — “tighten the pricing floor so it cannot be read as a guideline.”\" style=\"width:100%;min-height:84px;resize:vertical;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.10);background:#141110;color:#F6F3EF;font:400 14px/1.55 Geist,sans-serif\"><\u002Ftextarea>\n                <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px\">\n                  <button sc-camel-on-click=\"{{ sendComment }}\" style=\"padding:11px 16px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Add to file<\u002Fbutton>\n                  <span style=\"flex:1;font:500 12px/1.4 Geist,sans-serif;color:#524D46\">Notes are context, not content. A prompt runs in the next session against this file.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"min-width:0\">\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Suggested updates<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <sc-for list=\"{{ mkosFile.suggestions }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"background:#221C19;border:1px solid {{ g.border }};border-radius:16px;overflow:hidden\">\n                  <div style=\"padding:18px 20px\">\n                    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n                      <div style=\"font:600 16px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ g.title }}<\u002Fdiv>\n                      <sc-if value=\"{{ g.resolved }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font:600 11px/1.2 Geist,sans-serif;color:{{ g.resolvedFg }};white-space:nowrap\">{{ g.resolvedLabel }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:10px;font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ g.rationale }}<\u002Fdiv>\n                    <div style=\"margin-top:13px;display:flex;flex-wrap:wrap;gap:7px\">\n                      <sc-for list=\"{{ g.evidence }}\" as=\"ev\" hint-placeholder-count=\"2\">\n                        <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#948E84\">{{ ev }}<\u002Fspan>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:12px 20px;background:rgba(0,0,0,.18);font:500 13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace\">\n                    <sc-for list=\"{{ g.diff }}\" as=\"l\" hint-placeholder-count=\"2\">\n                      <div style=\"display:flex;gap:10px;background:{{ l.bg }};margin:0 -20px;padding:2px 20px\"><span style=\"color:{{ l.markFg }};width:10px;flex:0 0 auto\">{{ l.mark }}<\u002Fspan><span style=\"color:{{ l.fg }};text-wrap:pretty\">{{ l.text }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center\">\n                      <button sc-camel-on-click=\"{{ g.approve }}\" style=\"padding:11px 16px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Approve update<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ g.dismiss }}\" style=\"padding:11px 16px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#BDB7AD;font:600 13px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">Dismiss<\u002Fbutton>\n                      <span style=\"flex:1;text-align:right;font:500 12px/1.3 Geist,sans-serif;color:#524D46\">Not written yet<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ ACCOUNTS ============ -->\n    <sc-if value=\"{{ isAccounts }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Accounts<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Everyone you work with<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">Open one for the deals, calls, tasks, contracts and platform data behind it.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px\">\n          <sc-for list=\"{{ accountList }}\" as=\"a\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ a.open }}\" style=\"text-align:left;width:100%;background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\" style-hover=\"border-color:rgba(255,255,255,.22)\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n                <div style=\"min-width:0\">\n                  <div style=\"font:600 17px/1.3 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ a.name }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:6px\">{{ a.kind }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ a.statusBg }};color:{{ a.statusFg }};white-space:nowrap\">{{ a.status }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px 18px;font:500 12px/1.3 Geist,sans-serif;color:#948E84\">\n                <span>{{ a.ltv }}<\u002Fspan>\n                <span>{{ a.headline }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07)\">\n                <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">Owner {{ a.owner }} · {{ a.openTasks }}<\u002Fspan>\n                <span style=\"font:600 12px/1.2 Geist,sans-serif;color:#EA744B\">Open →<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ ACCOUNT DETAIL ============ -->\n    <sc-if value=\"{{ isAccountDetail }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <button sc-camel-on-click=\"{{ backToAccounts }}\" style=\"margin-bottom:20px;padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#948E84;font:600 12px/1.2 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">All accounts<\u002Fbutton>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:26px\">\n          <div style=\"display:flex;gap:16px;align-items:flex-start;min-width:0\">\n            <div style=\"width:52px;height:52px;flex:0 0 auto;border-radius:14px;background:rgba(227,83,45,.14);color:#EA744B;display:flex;align-items:center;justify-content:center;font:700 17px/1 Geist,sans-serif\">{{ account.initials }}<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n                <h1 style=\"margin:0;font:700 32px/1.1 Geist,sans-serif;letter-spacing:-0.03em\">{{ account.name }}<\u002Fh1>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:5px 9px;border-radius:6px;background:{{ account.statusBg }};color:{{ account.statusFg }}\">{{ account.status }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:11px;font:500 13px/1.4 Geist,sans-serif;color:#948E84\">{{ account.kind }} · owner {{ account.owner }} · customer since {{ account.since }} · {{ account.ltvLine }}<\u002Fdiv>\n              <div style=\"margin-top:14px;max-width:640px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ account.summary }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <button style=\"padding:11px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Open in Attio<\u002Fbutton>\n            <button style=\"padding:11px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Open in Airtable<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:28px\">\n          <sc-for list=\"{{ account.metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F\">{{ m.label }}<\u002Fdiv>\n              <div style=\"font:700 28px/1.05 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF;margin-top:10px\">{{ m.value }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#524D46;margin-top:8px\">{{ m.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:24px;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:28px;min-width:0\">\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Call log<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ account.calls }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:17px\">\n                    <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                      <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:#BDB7AD\">{{ c.type }}<\u002Fspan>\n                      <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F\">{{ c.date }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:600 14px/1.35 Geist,sans-serif;color:#F6F3EF;margin-top:11px\">{{ c.who }}<\u002Fdiv>\n                    <div style=\"font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;margin-top:8px;text-wrap:pretty\">{{ c.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Notes &amp; ideas<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-bottom:14px\">\n                <sc-for list=\"{{ account.notes }}\" as=\"n\" hint-placeholder-count=\"4\">\n                  <div style=\"background:{{ n.bg }};border:1px solid {{ n.border }};border-radius:14px;padding:15px 17px\">\n                    <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                      <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:{{ n.kindBg }};color:{{ n.kindFg }}\">{{ n.kind }}<\u002Fspan>\n                      <span style=\"font:600 13px/1.2 Geist,sans-serif;color:#F6F3EF\">{{ n.who }}<\u002Fspan>\n                      <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F\">{{ n.when }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:9px;font:400 14px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ n.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px\">\n                <div style=\"display:flex;gap:7px;margin-bottom:12px\">\n                  <sc-for list=\"{{ acctKinds }}\" as=\"k\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ k.pick }}\" style=\"padding:8px 14px;border-radius:9px;border:1px solid {{ k.border }};background:{{ k.bg }};color:{{ k.fg }};font:600 12px/1.2 Geist,sans-serif\">{{ k.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <textarea value=\"{{ acctDraft }}\" sc-camel-on-change=\"{{ setAcctDraft }}\" placeholder=\"What just happened, or what we should try next with this account.\" style=\"width:100%;min-height:76px;resize:vertical;padding:12px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.10);background:#141110;color:#F6F3EF;font:400 14px/1.55 Geist,sans-serif\"><\u002Ftextarea>\n                <div style=\"display:flex;align-items:center;gap:12px;margin-top:12px\">\n                  <button sc-camel-on-click=\"{{ addAcctNote }}\" style=\"padding:11px 16px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Add<\u002Fbutton>\n                  <span style=\"flex:1;font:500 12px/1.4 Geist,sans-serif;color:#524D46\">Notes and ideas stay on the account and feed the next strategy session.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Open tasks<\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n                <sc-for list=\"{{ account.tasks }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                    <div style=\"font:500 14px/1.4 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ t.task }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px\">\n                      <span style=\"font:500 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:#BDB7AD\">{{ t.owner }}<\u002Fspan>\n                      <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#948E84\">{{ t.source }}<\u002Fspan>\n                      <span style=\"font:500 12px/1.3 Geist,sans-serif;color:{{ t.nextColor }}\">{{ t.next }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:28px;min-width:0\">\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Deals<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ account.deals }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div style=\"background:#1E1A18;border:1px solid {{ d.border }};border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px\">\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font:600 14px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ d.name }}<\u002Fdiv>\n                      <div style=\"font:500 12px/1.3 Geist,sans-serif;color:{{ d.ageColor }};margin-top:7px\">{{ d.stage }} · {{ d.age }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font:700 18px/1 Geist,sans-serif;letter-spacing:-0.02em;color:#F6F3EF;flex:0 0 auto\">{{ d.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Platform data<\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n                <sc-for list=\"{{ account.platform }}\" as=\"p\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                    <span style=\"font:500 13px/1.4 Geist,sans-serif;color:#948E84\">{{ p.label }}<\u002Fspan>\n                    <span style=\"font:600 14px/1.3 Geist,sans-serif;color:#F6F3EF;text-align:right\">{{ p.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Contracts &amp; documents<\u002Fdiv>\n              <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n                <sc-for list=\"{{ account.contracts }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                    <span style=\"width:6px;height:6px;border-radius:999px;background:{{ c.dot }};flex:0 0 auto\"><\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font:500 14px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ c.name }}<\u002Fdiv>\n                      <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ c.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#948E84;white-space:nowrap\">{{ c.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Contacts<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ account.contacts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                  <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:14px 16px\">\n                    <div style=\"font:600 14px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ c.name }}<\u002Fdiv>\n                    <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ c.title }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ TEAM & VENDORS ============ -->\n    <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:26px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Team &amp; vendors<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Eight sets of hands<\u002Fh1>\n          <div style=\"margin-top:10px;font:400 15px/1.5 Geist,sans-serif;color:#948E84\">Four inside, four outside. Who is loaded, who is idle, and what each one owns.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:30px\">\n          <sc-for list=\"{{ resourceStats }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#6E685F\">{{ r.label }}<\u002Fdiv>\n              <div style=\"font:700 28px/1.05 Geist,sans-serif;letter-spacing:-0.03em;color:#F6F3EF;margin-top:10px\">{{ r.value }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.35 Geist,sans-serif;color:#524D46;margin-top:8px\">{{ r.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Inside<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:34px\">\n          <sc-for list=\"{{ people }}\" as=\"p\" hint-placeholder-count=\"2\">\n            <div style=\"background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:22px\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px\">\n                <div style=\"width:38px;height:38px;flex:0 0 auto;border-radius:999px;background:{{ p.color }};color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px/1 Geist,sans-serif\">{{ p.initials }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 18px/1.25 Geist,sans-serif;color:#F6F3EF\">{{ p.name }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ p.role }} · {{ p.focus }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:20px;display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#948E84\">{{ p.hours }}<\u002Fspan>\n                <span style=\"font:600 12px/1.2 Geist,sans-serif;color:{{ p.loadColor }};text-align:right\">{{ p.load }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:10px;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden\">\n                <div style=\"height:100%;width:{{ p.loadW }};background:{{ p.barColor }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:6px\">\n                <sc-for list=\"{{ p.owns }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#BDB7AD\">{{ o }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ p.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                  <div style=\"font:400 13px/1.5 Geist,sans-serif;color:#BDB7AD;display:flex;gap:9px\"><span style=\"color:#524D46\">·<\u002Fspan>{{ i }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Outside<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:34px\">\n          <sc-for list=\"{{ vendors }}\" as=\"v\" hint-placeholder-count=\"2\">\n            <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:22px\">\n              <div style=\"display:flex;align-items:flex-start;gap:14px\">\n                <div style=\"width:38px;height:38px;flex:0 0 auto;border-radius:999px;background:{{ v.color }};color:#fff;display:flex;align-items:center;justify-content:center;font:700 13px/1 Geist,sans-serif\">{{ v.initials }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 18px/1.25 Geist,sans-serif;color:#F6F3EF\">{{ v.name }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ v.kind }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;font:500 13px/1.4 Geist,sans-serif;color:#BDB7AD\">{{ v.contract }}<\u002Fdiv>\n              <div style=\"margin-top:14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px\">\n                <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#948E84\">{{ v.usedLabel }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:9px;height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden\">\n                <div style=\"height:100%;width:{{ v.usedW }};background:{{ v.barColor }}\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;display:flex;flex-wrap:wrap;gap:6px\">\n                <sc-for list=\"{{ v.owns }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.06);color:#BDB7AD\">{{ o }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px\">\n                <div style=\"font:600 13px/1.45 Geist,sans-serif;color:{{ v.waitingColor }}\">{{ v.waiting }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.4 Geist,sans-serif;color:#6E685F\">{{ v.response }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Platforms<\u002Fdiv>\n          <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F\">Where the work actually lives. This app reads them.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:34px\">\n          <sc-for list=\"{{ platforms }}\" as=\"p\" hint-placeholder-count=\"11\">\n            <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:17px\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"width:6px;height:6px;border-radius:999px;background:{{ p.dot }};flex:0 0 auto\"><\u002Fspan>\n                <div style=\"flex:1;min-width:0;font:600 15px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ p.name }}<\u002Fdiv>\n                <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ p.stateBg }};color:{{ p.stateFg }};flex:0 0 auto\">{{ p.state }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:11px;font:400 13px/1.5 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ p.owns }}<\u002Fdiv>\n              <div style=\"margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n                <span style=\"font:500 12px/1.3 Geist,sans-serif;color:#BDB7AD\">{{ p.sync }}<\u002Fspan>\n                <span style=\"flex:1;font:500 12px/1.3 Geist,sans-serif;color:#948E84;text-align:right\">{{ p.feeds }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ p.connectable }}\" hint-placeholder-val=\"{{ false }}\">\n                <button style=\"margin-top:13px;width:100%;padding:10px;border-radius:10px;border:1px solid rgba(227,83,45,.45);background:rgba(227,83,45,.10);color:#EA744B;font:600 12px/1 Geist,sans-serif\" style-hover=\"background:rgba(227,83,45,.18)\">Connect {{ p.name }}<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Resources<\u002Fdiv>\n        <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden\">\n          <sc-for list=\"{{ resources }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n              <span style=\"width:6px;height:6px;border-radius:999px;background:{{ r.dot }};flex:0 0 auto\"><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font:500 14px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ r.name }}<\u002Fdiv>\n                <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ r.kind }} · {{ r.owner }} · {{ r.updated }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:500 12px/1.2 Geist,sans-serif;color:#948E84;white-space:nowrap\">{{ r.state }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ STRATEGY ============ -->\n    <sc-if value=\"{{ isStrategy }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin-bottom:26px\">\n          <div>\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Strategy sessions<\u002Fdiv>\n            <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">Think out loud, then promote it<\u002Fh1>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ openSessionPicker }}\" style=\"padding:12px 18px;border:0;border-radius:12px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Start a session<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ sessionPicker }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#221C19;border:1px solid rgba(227,83,45,.3);border-radius:16px;padding:20px;margin-bottom:24px\">\n            <div style=\"font:600 13px/1.2 Geist,sans-serif;color:#F6F3EF;margin-bottom:14px\">Which domain are we thinking about?<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ domainPicks }}\" as=\"d\" hint-placeholder-count=\"6\">\n                <button sc-camel-on-click=\"{{ d.pick }}\" style=\"padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(227,83,45,.14);border-color:rgba(227,83,45,.5)\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:start\">\n          <div>\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">Context files<\u002Fdiv>\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;margin-bottom:24px\">\n              <sc-for list=\"{{ contextFiles }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                  <span style=\"width:6px;height:6px;border-radius:999px;background:{{ c.dot }};flex:0 0 auto\"><\u002Fspan>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font:500 14px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ c.name }}<\u002Fdiv>\n                    <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">Updated {{ c.updated }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:4px 8px;border-radius:6px;background:{{ c.bg }};color:{{ c.fg }};white-space:nowrap\">{{ c.state }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">History<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ sessionHistory }}\" as=\"h\" hint-placeholder-count=\"4\">\n                <div style=\"background:#1E1A18;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px\">\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font:500 14px/1.35 Geist,sans-serif;color:#F6F3EF;text-wrap:pretty\">{{ h.title }}<\u002Fdiv>\n                    <div style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ h.date }} · {{ h.domain }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font:500 12px/1.2 Geist,sans-serif;color:{{ h.fg }};white-space:nowrap\">{{ h.result }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:14px\">{{ sessionTitle }}<\u002Fdiv>\n            <div style=\"background:#1A1614;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:280px\">\n              <sc-for list=\"{{ sessionChat }}\" as=\"m\" hint-placeholder-count=\"3\">\n                <div style=\"align-self:{{ m.align }};max-width:88%;background:{{ m.bg }};border:1px solid {{ m.border }};border-radius:14px;padding:13px 15px;font:400 14px/1.55 Geist,sans-serif;color:{{ m.fg }};text-wrap:pretty\">{{ m.text }}<\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:auto;display:flex;gap:9px;align-items:center;padding-top:8px\">\n                <div style=\"flex:1;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);font:400 14px/1.2 Geist,sans-serif;color:#524D46\">{{ chatPlaceholder }}<\u002Fdiv>\n                <button style=\"padding:12px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.08);color:#BDB7AD;font:600 13px/1 Geist,sans-serif\">Send<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasDiff }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:20px;background:#221C19;border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden\">\n                <div style=\"padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08)\">\n                  <div style=\"font:600 14px/1.3 Geist,sans-serif;color:#F6F3EF\">Proposed change · {{ diffFile }}<\u002Fdiv>\n                  <div style=\"font:500 12px/1.4 Geist,sans-serif;color:#6E685F;margin-top:6px\">Nothing is written until you promote it.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:14px 18px;font:500 13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace\">\n                  <sc-for list=\"{{ diffLines }}\" as=\"l\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex;gap:10px;background:{{ l.bg }};margin:0 -18px;padding:1px 18px\"><span style=\"color:{{ l.markFg }};width:10px;flex:0 0 auto\">{{ l.mark }}<\u002Fspan><span style=\"color:{{ l.fg }};text-wrap:pretty\">{{ l.text }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center\">\n                  <button sc-camel-on-click=\"{{ promote }}\" style=\"padding:11px 16px;border:0;border-radius:11px;background:#E3532D;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#C53F1C\">Promote to file<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ discard }}\" style=\"padding:11px 16px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#BDB7AD;font:600 13px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">Discard<\u002Fbutton>\n                  <div style=\"flex:1;text-align:right;font:500 12px/1.3 Geist,sans-serif;color:{{ promoteMsgColor }}\">{{ promoteMsg }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ APPROVALS ============ -->\n    <sc-if value=\"{{ isApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:mkFade 200ms ease-out\">\n        <div style=\"margin-bottom:22px\">\n          <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84;margin-bottom:10px\">Approvals<\u002Fdiv>\n          <h1 style=\"margin:0;font:700 36px/1.06 Geist,sans-serif;letter-spacing:-0.03em\">The human gate<\u002Fh1>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;background:rgba(227,83,45,.10);border:1px solid rgba(227,83,45,.28);border-radius:14px;margin-bottom:24px\">\n          <img src=\"e4bf41d8-6fff-45cc-9348-c2de85f69f98\" alt=\"\" style=\"width:20px;height:20px;flex:0 0 auto\">\n          <div style=\"font:600 14px/1.4 Geist,sans-serif;color:#F6F3EF\">Agents draft. Nothing goes to a client until you approve it.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"width:380px;flex:1 1 340px;min-width:320px\">\n            <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px\">\n              <div style=\"font:600 12px/1.3 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Pending<\u002Fdiv>\n              <div style=\"font:500 13px/1.2 Geist,sans-serif;color:#6E685F\">{{ pendingCount }} items<\u002Fdiv>\n            <\u002F ew<\u002Fdiv>\n              <div style=\"font:600 18px/1.3 Geist,sans-serif;color:#F6F3EF;margin-top:9px\">{{ sel.title }}<\u002Fdiv>\n              <div style=\"font:500 12px/1.3 Geist,sans-serif;color:#948E84;margin-top:6px\">{{ sel.account }} · {{ sel.type }} · {{ sel.agent }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:22px;display:flex;flex-direction:column;gap:14px;background:#151211\">\n              <sc-for list=\"{{ sel.body }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"font:400 14px/1.65 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ p }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"padding:18px 22px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:12px\">\n              <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ approve }}\" style=\"flex:1;min-width:120px;padding:12px;border:0;border-radius:11px;background:#1F8A5B;color:#fff;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:#14633F\">Approve<\u002Fbutton>\n                <button style=\"padding:12px 16px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#F6F3EF;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(255,255,255,.06)\">Edit<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ toggleReject }}\" style=\"padding:12px 16px;border:1px solid rgba(229,57,47,.4);border-radius:11px;background:transparent;color:#FF8A8A;font:600 13px/1 Geist,sans-serif\" style-hover=\"background:rgba(229,57,47,.10)\">Reject<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ rejectOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:9px;padding:14px;background:rgba(229,57,47,.08);border:1px solid rgba(229,57,47,.24);border-radius:12px\">\n                  <div style=\"font:600 12px/1.2 Geist,sans-serif;color:#FF8A8A\">Reason — the agent learns from this<\u002Fdiv>\n                  <textarea placeholder=\"Price is under the portfolio floor. Rebuild at Professional tier.\" style=\"width:100%;min-height:70px;resize:vertical;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#141110;color:#F6F3EF;font:400 13px/1.5 Geist,sans-serif\"><\u002Ftextarea>\n                  <button sc-camel-on-click=\"{{ reject }}\" style=\"align-self:flex-start;padding:9px 14px;border:0;border-radius:10px;background:#E5392F;color:#fff;font:600 12px/1 Geist,sans-serif\">Send back to agent<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font:500 12px/1.4 Geist,sans-serif;color:{{ approveMsgColor }}\">{{ approveMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <!-- ===== FOURTH-FIRE MODAL ===== -->\n  <sc-if value=\"{{ fireModal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(10,9,8,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:28px;z-index:60;animation:mkFade 160ms ease-out\">\n      <div style=\"width:100%;max-width:620px;background:#221C19;border:1px solid rgba(227,83,45,.32);border-radius:18px;overflow:hidden;animation:mkIn 200ms cubic-bezier(.2,.7,.3,1)\">\n        <div style=\"padding:26px 26px 20px\">\n          <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#E3532D\">Three is the cap<\u002Fdiv>\n          <h2 style=\"margin:12px 0 0;font:700 26px/1.2 Geist,sans-serif;letter-spacing:-0.02em;color:#F6F3EF\">Something has to come off the list<\u002Fh2>\n          <div style=\"margin-top:12px;font:400 15px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">You want to add <strong style=\"color:#F6F3EF;font-weight:600\">{{ candidate.name }}<\u002Fstrong>. Pick the fire it replaces — it drops back to This Week, it doesn't disappear.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:0 26px 8px;display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ demoteChoices }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ c.demote }}\" style=\"text-align:left;width:100%;background:#1A1614;border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:15px 17px;display:flex;align-items:center;gap:14px\" style-hover=\"border-color:rgba(227,83,45,.5);background:rgba(227,83,45,.08)\">\n              <span style=\"width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:rgba(255,255,255,.06);color:#948E84;display:flex;align-items:center;justify-content:center;font:700 12px/1 Geist,sans-serif\">{{ c.rank }}<\u002Fspan>\n              <span style=\"flex:1;min-width:0\">\n                <span style=\"display:block;font:600 15px/1.3 Geist,sans-serif;color:#F6F3EF\">{{ c.name }}<\u002Fspan>\n                <span style=\"display:block;font:500 12px/1.3 Geist,sans-serif;color:#6E685F;margin-top:5px\">{{ c.domain }} · {{ c.age }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font:600 12px/1 Geist,sans-serif;color:#EA744B;white-space:nowrap\">Demote<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:20px 26px 24px;display:flex;align-items:center;gap:12px\">\n          <button sc-camel-on-click=\"{{ closeFireModal }}\" style=\"padding:11px 16px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:transparent;color:#BDB7AD;font:600 13px/1 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">Never mind<\u002Fbutton>\n          <div style=\"flex:1;font:500 12px/1.4 Geist,sans-serif;color:#524D46;text-align:right\">The cap is the feature. Four fires means none of them move.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ===== TASK BREAKDOWN DRAWER ===== -->\n  <sc-if value=\"{{ breakdown }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:56;display:flex;justify-content:flex-end;animation:mkFade 160ms ease-out\">\n      <div sc-camel-on-click=\"{{ closeBreakdown }}\" style=\"position:absolute;inset:0;background:rgba(10,9,8,.6)\"><\u002Fdiv>\n      <div style=\"position:relative;width:100%;max-width:540px;height:100%;overflow-y:auto;background:#1A1614;border-left:1px solid rgba(255,255,255,.10)\">\n        <div style=\"padding:26px;border-bottom:1px solid rgba(255,255,255,.08)\">\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:14px\">\n            <div style=\"min-width:0\">\n              <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Task breakdown<\u002Fdiv>\n              <h2 style=\"margin:11px 0 0;font:700 22px/1.25 Geist,sans-serif;letter-spacing:-0.02em;color:#F6F3EF;text-wrap:pretty\">{{ breakdown.task }}<\u002Fh2>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ closeBreakdown }}\" style=\"padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:transparent;color:#948E84;font:600 13px/1 Geist,sans-serif;flex:0 0 auto\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-top:16px\">\n            <span style=\"font:500 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:#BDB7AD\">{{ breakdown.domain }}<\u002Fspan>\n            <span style=\"font:500 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.05);color:#BDB7AD\">{{ breakdown.owner }}<\u002Fspan>\n            <span style=\"font:600 11px/1.2 Geist,sans-serif;padding:3px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.12);color:#948E84\">{{ breakdow 0;border:0;background:transparent;font:500 14px/1.5 Geist,sans-serif;color:{{ st.fg }};text-decoration:{{ st.deco }};text-wrap:pretty\" style-hover=\"color:#EA744B\">{{ st.step }}<\u002Fbutton>\n                  <div style=\"font:500 12px/1.2 Geist,sans-serif;color:#6E685F;margin-top:6px\">{{ st.who }} · {{ st.mins }}<\u002Fdiv>\n                  <sc-if value=\"{{ st.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:12px;padding:13px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:11px\">\n                      <div style=\"font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">How<\u002Fdiv>\n                      <div style=\"margin-top:8px;font:400 13px/1.6 Geist,sans-serif;color:#BDB7AD;text-wrap:pretty\">{{ st.tip }}<\u002Fdiv>\n                      <div style=\"margin-top:13px;font:600 11px/1.2 Geist,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#948E84\">Tools<\u002Fdiv>\n                      <div style=\"margin-top:9px;display:flex;flex-wrap:wrap;gap:6px\">\n                        <sc-for list=\"{{ st.tools }}\" as=\"tl\" hint-placeholder-count=\"2\">\n                          <button sc-camel-on-click=\"{{ tl.go }}\" style=\"padding:5px 10px;border-radius:8px;border:1px solid {{ tl.border }};background:{{ tl.bg }};color:{{ tl.fg }};font:600 11px/1.3 Geist,sans-serif\" style-hover=\"border-color:rgba(255,255,255,.3)\">{{ tl.label }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ st.expand }}\" style=\"flex:0 0 auto;margin-top:1px;padding:4px 8px;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:transparent;color:#6E685F;font:600 12px/1.3 Geist,sans-serif\" style-hover=\"color:#F6F3EF\">{{ st.chev }}<\u002Fb e ceiling without headcount.']},\n     {heading:'Refusals',lines:['No custom native apps.','No single-event work under $4,000.','No white-label deployment before v2.0 ships.']}],\n   suggestions:[\n     {id:'s1',title:'State the 85% commitment ceiling as a rule',rationale:'Delivery is at 68% committed with 55 unsigned hours in proposals. Two more builds fills the month, and the strategy file has no stated ceiling.',evidence:['Delivery · capacity 68%','Pipeline · 55h unsigned'],\n      diff:[{mark:'+',text:'Do not commit past 85% of monthly delivery hours. Above that, quote the next window.'},{mark:'+',text:'Unsigned proposals count against the ceiling at 50% of their hours.'}]},\n     {id:'s2',title:'Name automation % as the primary company metric',rationale:'Pipeline automation moved from 18% to 24% this quarter while revenue grew 18%. The file still frames revenue as the headline metric.',evidence:['Company · automation 24%','Product · 3 agents in build'],\n      diff:[{mark:'-',text:'Revenue growth is the primary signal of health.'},{mark:'+',text:'Automation % is the primary signal of health. Revenue without automation is hours we cannot repeat.'}]}],\n   comments:[{who:'Max',when:'Sep 2',text:'The refusals list is the useful part. Keep it short and keep it honest.'},{who:'Session agent',when:'Sep 2',text:'Two refusals were added from the Aug 6 session on what breaks at 30 events a year.'}]},\n\n  {id:'dna',name:'Product DNA',purpose:'What every Map King experience must do, regardless of vertical.',updated:'Sep 2, 2026',days:7,version:14,words:3100,\n   sections:[\n     {heading:'Non-negotiables',lines:['The map is the primary canvas. Content layers on it, never replaces it.','Works in a browser, on a bad connection, on a phone someone is holding one-handed.','No login before value.']},\n     {heading:'Build pipeline',lines:['Content Ingestion → Auto-Build → QA → Launch Kit → Live → Post-Event Intelligence.','Every stage has a runbook. A stage without a runbook is a stage we cannot hand to an agent.']},\n     {heading:'AI posture',lines:['Agents draft. Humans approve anything a customer sees.','Suggested content is labeled as suggested.']}],\n   suggestions:[\n     {id:'s3',title:'Add a taxonomy rule so the decision stops recurring',rationale:'The placemark taxonomy decision has blocked Kyle twice and is currently 2 days open in Linear. The file describes stages but not the content model.',evidence:['Product · MK-407 needs decision','Today · Kyle blocked 2 days'],\n      diff:[{mark:'+',text:'One taxonomy across all verticals. Vertical-specific categories are aliases, never new roots.'},{mark:'+',text:'A new root category requires a founder decision and a migration note.'}]}],\n   comments:[{who:'Max',when:'Sep 2',text:'No login before value is the one people argue with. It stays.'}]},\n\n  {id:'sales',name:'Sales Playbook',purpose:'How deals are qualified, priced and followed up.',updated:'Jun 14, 2026',days:87,version:13,words:2750,\n   sections:[\n     {heading:'Qualification',lines:['Attendance, venue complexity, and whether someone owns content on their side.','No content owner means no build. Walk.']},\n     {heading:'Pricing',lines:['Three tiers: Essential $4,500, Professional $9,500, Enterprise $18,500.','Overages: $18 per placemark, $45 per content page, $0.05 per head over tier.']},\n     {heading:'Follow-up',lines:['Proposal out means a call in 5 days, not an email.']}],\n   suggestions:[\n     {id:'s4',title:'Write the pricing floor and portfolio exception',rationale:'Two builds were priced below list and consumed 41 delivery hours each. INDYCAR has sat 34 days after a good pitch with no next step, which the 5-day rule should have caught.',evidence:['Pipeline · 2 deals no next step','Delivery · 41h per underpriced build'],\n      diff:[{mark:'-',text:'Discount at your discretion for strategic accounts.'},{mark:'+',text:'List price is the floor. Below-list requires a portfolio commitment of 2+ events.'},{mark:'+',text:'Portfolio rate is 15% off list, applied across the committed events.'}]},\n     {id:'s5',title:'Make the 5-day rule enforceable',rationale:'The rule exists but nothing surfaces a breach. Days-in-stage is already tracked in Pipeline.',evidence:['Pipeline · INDYCAR 34 days'],\n      diff:[{mark:'+',text:'A deal with no next step is a breach, not a status. Force Done, Drop or Reschedule at day 7.'}]}],\n   comments:[{who:'Max',when:'Sep 9',text:'This is the file I break most. Make the floor unambiguous.'},{who:'Session agent',when:'Aug 19',text:'Per-slot vs per-event sponsor pricing was explored and discarded.'}]},\n\n  {id:'delivery',name:'Delivery Playbook',purpose:'How a build runs from signature to post-event report.',updated:'Aug 3, 2026',days:37,version:11,words:4200,\n   sections:[\n     {heading:'Build windows',lines:['Festival 25 days. Convention 14 days. Destination guide 20 days. Motorsport 30 days.','A signed date inside the window is a red build on day one.']},\n     {heading:'QA gates',lines:['No critical issues at launch. Mediums are a judgment call with the account owner.','Kyle is the only QA sign-off today.']},\n     {heading:'Handoffs',lines:['Content freeze must be agreed in writing before ingestion opens.']}],\n   suggestions:[\n     {id:'s6',title:'Make content freeze a gate, not a step',rationale:'SynerComm is 27 days from launch against a 30-day window with no agreed freeze date, and ingestion is stalled at 35%.',evidence:['Delivery · SynerComm 27d vs 30d','Today · fire rank 3'],\n      diff:[{mark:'+',text:'Ingestion does not open without a freeze date in writing. No exceptions, including for signed work.'},{mark:'+',text:'If the freeze date slips, the launch date moves with it.'}]}],\n   comments:[{who:'Kyle',when:'Aug 3',text:'Motorsport at 30 days assumes we get the survey file early. We rarely do.'}]},\n\n  {id:'custint',name:'Customer Intelligence',purpose:'What we have learned about who renews and why.',updated:'Sep 8, 2026',days: g to use it.'],\n   variant:['Here is the {YEAR} program for {VENUE}.',\n     '{PLACEMARKS} placemarks, {PAGES} content pages, schedule sync, {SLOTS} sponsor slots. {TIER} tier, {PRICE}.',\n     'Ingestion {INGEST_DATE} · QA closes {QA_DATE} · launch kit two weeks before {EVENT_DATE}.']},\n\n  {id:'l2',name:'Content freeze email',kind:'Template',audience:'External',source:'Airtable',updated:'Sep 8, 2026',\n   use:'Sent the day a build is signed. The gate that stops late-content spirals.',tags:['Delivery','Gate'],\n   body:['Hi {NAME} — before we open ingestion for {EVENT}, we need one date from you.',\n     'Content freeze: the last day we can accept placemark and schedule changes without moving the launch date. For a {WINDOW}-day build ending {EVENT_DATE}, that date is {FREEZE_DATE}.',\n     'After the freeze we can still fix errors. We cannot add new content.',\n     'Reply with the date confirmed and Kyle opens ingestion the same day.'],\n   variant:['Hi {NAME} — one date and we start.',\n     'Content freeze for {EVENT} is {FREEZE_DATE}. After it we fix errors, not add content.',\n     'Confirm the date and ingestion opens the same day.']},\n\n  {id:'l3',name:'Post-event report',kind:'Template',audience:'External',source:'Airtable',updated:'Aug 30, 2026',\n   use:'Structure the Intelligence agent fills. Numbers first, recommendation last.',tags:['Delivery','Report'],\n   body:['{USERS} unique users across {DAYS} days, {ADOPTION}% of gate attendance.',\n     'Most-viewed placemarks: {TOP_THREE}. Wayfinding sessions peaked {PEAK_WINDOW}.',\n     'Sponsor slots delivered {IMPRESSIONS} impressions at a {TAP}% tap-through. {UNDER_COUNT} of {SLOT_COUNT} slots underdelivered.',\n     'Recommendation for {NEXT_YEAR}: {RECOMMENDATION}.'],\n   variant:['{ADOPTION}% adoption, {USERS} users, {IMPRESSIONS} sponsor impressions at {TAP}%.',\n     'What to change next year: {RECOMMENDATION}.']},\n\n  {id:'l4',name:'Sponsor one-pager',kind:'Template',audience:'External',source:'
